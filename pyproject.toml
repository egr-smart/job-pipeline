[project]
name = "job-pipeline"
version = "0.1.0"
description = "Automated remote job search: fetch, filter, LLM-score, email a shortlist."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "markdown>=3.5",
    "openai>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
jobs = "job_pipeline.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
