# Location vocabulary used by the location filter.
#
# countries: ISO code -> phrases that name that country in a job's location string.
# regions:   phrases that name a region -> the countries it covers ("*" = everywhere).
#
# Matching is whole-word and case-insensitive on the *location* string only (never the
# description). A job whose location names any place covering your home_country is allowed;
# one that names places but none covering you is denied; one naming nothing is "unknown".

countries:
  AU: [australia, aus, sydney, melbourne, brisbane, perth, adelaide, canberra]
  NZ: [new zealand, auckland, wellington]
  SG: [singapore]
  JP: [japan, tokyo]
  KR: [south korea, korea, seoul]
  CN: [china, beijing, shanghai, shenzhen]
  HK: [hong kong]
  TW: [taiwan, taipei]
  IN: [india, bangalore, bengaluru, hyderabad, pune, mumbai, delhi, chennai]
  ID: [indonesia, jakarta]
  MY: [malaysia, kuala lumpur]
  PH: [philippines, manila]
  TH: [thailand, bangkok]
  VN: [vietnam, ho chi minh, hanoi]
  US: [united states, united states of america, usa, us, u.s., u.s.a., new york, nyc, san francisco, seattle, austin, boston, chicago, denver, los angeles]
  CA: [canada, toronto, vancouver, montreal]
  MX: [mexico]
  BR: [brazil, sao paulo]
  AR: [argentina, buenos aires]
  CO: [colombia]
  CL: [chile]
  GB: [united kingdom, uk, u.k., england, scotland, wales, great britain, london, manchester, edinburgh]
  IE: [ireland, dublin]
  DE: [germany, berlin, munich]
  FR: [france, paris]
  NL: [netherlands, amsterdam]
  ES: [spain, madrid, barcelona]
  PT: [portugal, lisbon]
  IT: [italy]
  PL: [poland, warsaw]
  SE: [sweden, stockholm]
  NO: [norway]
  DK: [denmark, copenhagen]
  FI: [finland, helsinki]
  CH: [switzerland, zurich]
  AT: [austria, vienna]
  BE: [belgium]
  CZ: [czech republic, czechia, prague]
  RO: [romania]
  GR: [greece]
  UA: [ukraine]
  IL: [israel, tel aviv]
  AE: [uae, united arab emirates, dubai]
  ZA: [south africa, cape town]
  NG: [nigeria]
  KE: [kenya]
  EG: [egypt]
  TR: [turkey, turkiye]

regions:
  - names: [worldwide, anywhere, global, globally, international, any location, all locations]
    countries: ["*"]
  - names: [apac, asia pacific, asia pac, apj, asia]
    countries: [AU, NZ, SG, JP, KR, CN, HK, TW, IN, ID, MY, PH, TH, VN]
  - names: [anz, oceania, australasia, australia and new zealand]
    countries: [AU, NZ]
  - names: [emea]
    countries: [GB, IE, DE, FR, NL, ES, PT, IT, PL, SE, NO, DK, FI, CH, AT, BE, CZ, RO, GR, UA, IL, AE, ZA, NG, KE, EG, TR]
  - names: [europe, eu, european union, eea]
    countries: [GB, IE, DE, FR, NL, ES, PT, IT, PL, SE, NO, DK, FI, CH, AT, BE, CZ, RO, GR, UA, TR]
  - names: [americas, north america, n america, amer, noram]
    countries: [US, CA, MX]
  - names: [latam, latin america, south america]
    countries: [MX, BR, AR, CO, CL]
