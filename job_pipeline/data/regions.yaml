# Location vocabulary used by the location filter.
#
# Avoid aliases that are also common words or other places' names (e.g. "jersey" would
# match "New Jersey"; "cambridge" is also in Massachusetts).
#
# countries: ISO code -> phrases that name that country in a job's location string.
# regions:   phrases that name a region -> the countries it covers ("*" = everywhere).
#
# Matching is whole-word and case-insensitive on the *location* string only (never the
# description). A job whose location names any place covering your home_country is allowed;
# one that names places but none covering you is denied; one naming nothing is "unknown".

